[build]
  # No build command needed for vanilla JavaScript
  command = "npm run build:env"
  
  # Directory to publish (the root of your project)
  publish = "."

# Build script that creates environment variables file
[build.environment]
  NODE_VERSION = "18"

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Inject environment variables into the build for browser access
[build.processing]
  skip_processing = false

# Headers for better security and performance
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    
    # Performance headers
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment variable injection script
# This creates a script that makes Netlify env vars available to the browser
[build.processing.html]
  pretty_urls = true

# Custom build hook to inject environment variables
[[plugins]]
  package = "netlify-plugin-inline-env"
  
  [plugins.inputs]
    # Specify which env vars to make available to the browser
    include = ["VITE_SUPABASE_URL", "VITE_SUPABASE_ANON_KEY"] 