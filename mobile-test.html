<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Mobile Test - FLATTENHUND</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        
        .test-btn {
            background: #4EC0CA;
            color: white;
            border: 3px solid #000;
            padding: 20px 40px;
            margin: 10px;
            font-size: 18px;
            border-radius: 0;
            cursor: pointer;
            min-width: 200px;
            min-height: 60px;
            touch-action: manipulation;
        }
        
        .test-btn:active {
            background: #3AA0A8;
            transform: translateY(2px);
        }
        
        .log {
            background: rgba(0,0,0,0.7);
            color: #00ff00;
            font-family: monospace;
            padding: 15px;
            margin-top: 20px;
            border-radius: 5px;
            width: 100%;
            max-width: 400px;
            height: 200px;
            overflow-y: scroll;
            white-space: pre-wrap;
            font-size: 12px;
        }
        
        .status {
            font-size: 16px;
            margin: 10px 0;
        }
        
        .green { color: #00ff00; }
        .red { color: #ff4444; }
        .yellow { color: #ffff00; }
    </style>
</head>
<body>
    <h1>🔧 MOBILE DEBUG TEST</h1>
    
    <div class="status">
        <div>Device: <span id="device-info" class="yellow">Detecting...</span></div>
        <div>Touch Support: <span id="touch-support" class="yellow">Testing...</span></div>
        <div>Character Selected: <span id="char-status" class="red">None</span></div>
    </div>
    
    <button class="test-btn" id="test-touch">TEST TOUCH EVENTS</button>
    <button class="test-btn" id="select-taz">SELECT TAZ</button>
    <button class="test-btn" id="start-game" disabled>START GAME</button>
    
    <div class="log" id="log">Mobile Debug Log:\n</div>
    
    <script>
        let selectedCharacter = null;
        const log = document.getElementById('log');
        const deviceInfo = document.getElementById('device-info');
        const touchSupport = document.getElementById('touch-support');
        const charStatus = document.getElementById('char-status');
        const startBtn = document.getElementById('start-game');
        
        function logMessage(msg) {
            const timestamp = new Date().toLocaleTimeString();
            log.textContent += `[${timestamp}] ${msg}\n`;
            log.scrollTop = log.scrollHeight;
            console.log(`[MOBILE TEST] ${msg}`);
        }
        
        function updateStatus() {
            // Device detection
            const userAgent = navigator.userAgent;
            const isIOS = /iPad|iPhone|iPod/.test(userAgent);
            const isSafari = /Safari/.test(userAgent) && !/Chrome/.test(userAgent);
            deviceInfo.textContent = isIOS ? (isSafari ? 'iOS Safari ✅' : 'iOS Other Browser') : 'Not iOS';
            deviceInfo.className = isIOS ? 'green' : 'red';
            
            // Touch support
            const hasTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
            touchSupport.textContent = hasTouch ? 'Supported ✅' : 'Not Supported ❌';
            touchSupport.className = hasTouch ? 'green' : 'red';
            
            logMessage(`Device: ${deviceInfo.textContent}, Touch: ${touchSupport.textContent}`);
        }
        
        function selectTaz() {
            selectedCharacter = 'taz';
            charStatus.textContent = 'Taz ✅';
            charStatus.className = 'green';
            startBtn.disabled = false;
            startBtn.style.opacity = '1';
            logMessage('Character selected: Taz');
        }
        
        function startGame() {
            if (!selectedCharacter) {
                logMessage('ERROR: No character selected!');
                alert('Please select a character first!');
                return;
            }
            
            logMessage('🚀 GAME STARTED SUCCESSFULLY!');
            logMessage('Touch events are working properly!');
            
            // Simulate successful start
            document.body.style.background = 'linear-gradient(135deg, #00ff00 0%, #008800 100%)';
            document.querySelector('h1').textContent = '🎉 SUCCESS!';
            
            // Test haptic feedback if available
            if (navigator.vibrate) {
                navigator.vibrate([100, 50, 100]);
                logMessage('Haptic feedback triggered');
            }
        }
        
        // Event listeners with comprehensive logging
        document.getElementById('test-touch').addEventListener('touchstart', function(e) {
            e.preventDefault();
            logMessage('✅ TOUCHSTART working!');
        });
        
        document.getElementById('test-touch').addEventListener('touchend', function(e) {
            e.preventDefault();
            logMessage('✅ TOUCHEND working!');
        });
        
        document.getElementById('test-touch').addEventListener('click', function(e) {
            logMessage('✅ CLICK working!');
        });
        
        document.getElementById('select-taz').addEventListener('touchend', function(e) {
            e.preventDefault();
            logMessage('Taz button touched');
            selectTaz();
        });
        
        document.getElementById('select-taz').addEventListener('click', function(e) {
            logMessage('Taz button clicked');
            selectTaz();
        });
        
        document.getElementById('start-game').addEventListener('touchend', function(e) {
            e.preventDefault();
            logMessage('Start button touched');
            startGame();
        });
        
        document.getElementById('start-game').addEventListener('click', function(e) {
            logMessage('Start button clicked');
            startGame();
        });
        
        // Global touch logging
        document.addEventListener('touchstart', function(e) {
            logMessage(`Global touchstart: ${e.target.tagName} ${e.target.id}`);
        });
        
        document.addEventListener('touchend', function(e) {
            logMessage(`Global touchend: ${e.target.tagName} ${e.target.id}`);
        });
        
        // Page load and initialization
        document.addEventListener('DOMContentLoaded', function() {
            logMessage('DOM Content Loaded');
            updateStatus();
            
            // Test initial state
            setTimeout(() => {
                logMessage('Page fully loaded and ready');
                logMessage('Try touching the buttons to test functionality');
            }, 500);
        });
        
        // Error handling
        window.addEventListener('error', function(e) {
            logMessage(`ERROR: ${e.message} at ${e.filename}:${e.lineno}`);
        });
        
        // Orientation change handling
        window.addEventListener('orientationchange', function() {
            setTimeout(() => {
                logMessage('Orientation changed');
                updateStatus();
            }, 100);
        });
    </script>
</body>
</html>
